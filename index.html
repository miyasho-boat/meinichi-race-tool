<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宮商ボートレース・厳選レースツール</title>

<style>
body{
margin:0;
background:#111;
color:#fff;
font-family:sans-serif;
padding:20px;
}

h1{
text-align:center;
color:#FFD700;
}

.box{
background:#222;
padding:15px;
margin:15px 0;
border-radius:10px;
}

select,input{
width:100%;
padding:12px;
font-size:18px;
margin-top:8px;
}

button{
width:100%;
padding:15px;
font-size:20px;
background:#FFD700;
border:none;
border-radius:10px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🏁宮商ボートレース<br>厳選レースツール</h1>

<div class="box">

<label>📅 日付</label>
<input type="date">

</div>

<div class="box">

<label>🏟 レース場</label>

<select>

<option>桐生</option>
<option>戸田</option>
<option>江戸川</option>
<option>平和島</option>
<option>多摩川</option>
<option>浜名湖</option>
<option>蒲郡</option>
<option>常滑</option>
<option>津</option>
<option>三国</option>
<option>びわこ</option>
<option>住之江</option>
<option>尼崎</option>
<option>鳴門</option>
<option>丸亀</option>
<option>児島</option>
<option>宮島</option>
<option>徳山</option>
<option>下関</option>
<option>若松</option>
<option>芦屋</option>
<option>福岡</option>
<option>唐津</option>
<option>大村</option>

</select>

</div>

<div class="box">

<label>🏁 レース</label>

<select>

<option>1R</option>
<option>2R</option>
<option>3R</option>
<option>4R</option>
<option>5R</option>
<option>6R</option>
<option>7R</option>
<option>8R</option>
<option>9R</option>
<option>10R</option>
<option>11R</option>
<option>12R</option>

</select>

</div>

<div class="box">

<label>📷 出走表画像</label>

<input type="file" id="imageInput" accept="image/*">

<br><br>

<img id="preview" style="max-width:100%;display:none;border-radius:10px;">
  <canvas id="canvas" style="display:none;"></canvas>

</div>

<button>

解析開始

</button>
  <div class="box">

<h2>OCR解析結果</h2>

<pre id="result">
ここに解析結果が表示されます
</pre>

</div>
<script>
  async function readNames(file){

    const img = new Image();

    img.src = URL.createObjectURL(file);

    await new Promise(r=>img.onload=r);

    const canvas=document.getElementById("canvas");
    const ctx=canvas.getContext("2d");

    canvas.width=img.width;
    canvas.height=img.height;

    ctx.drawImage(img,0,0);

    // 名前欄だけ切り抜き
    const sx=220;
    const sy=120;
    const sw=220;
    const sh=760;

    const nameCanvas=document.createElement("canvas");

    nameCanvas.width=sw;
    nameCanvas.height=sh;

    const nctx=nameCanvas.getContext("2d");

    nctx.drawImage(
        canvas,
        sx,sy,sw,sh,
        0,0,sw,sh
    );

    const result=await Tesseract.recognize(
        nameCanvas,
        "jpn"
    );

    return result.data.text;
}
const dateInput = document.querySelector('input[type="date"]');

const tomorrow = new Date();
tomorrow.setDate(tomorrow.getDate() + 1);

const y = tomorrow.getFullYear();
const m = String(tomorrow.getMonth() + 1).padStart(2, "0");
const d = String(tomorrow.getDate()).padStart(2, "0");

dateInput.value = `${y}-${m}-${d}`;
  const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");

imageInput.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});
  const button = document.querySelector("button");
const resultArea = document.getElementById("result");

button.addEventListener("click", async function () {

  if (!imageInput.files[0]) {
    alert("出走表画像を選択してください。");
    return;
  }

  resultArea.textContent = "解析中...";

  const text = await readNames(imageInput.files[0]);


  const lines = text
  .split("\n")
  .map(line => line.trim())
  .filter(line => line !== "");


let output = "";
let boat = 0;


lines.forEach(line => {

  // 1〜6の単独数字を艇番号として認識
  if(/^[1-6]$/.test(line)){

    boat = Number(line);

    output += "\n━━━━━━━━━━\n";
    output += "🚤 " + boat + "号艇\n\n";

    return;
  }


  output += line + "\n";

});


output += "\n━━━━━━━━━━";


resultArea.textContent = output;

});
</script>
  <script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
</body>
</html>
